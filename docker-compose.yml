services:
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    working_dir: /var/www
    command: ["sh", "docker-entrypoint.sh"]

  angular:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    working_dir: /app
    command: ["sh", "-c", "[ -d node_modules ] || npm ci; npm start -- --host 0.0.0.0"]
    stdin_open: true
    tty: true
