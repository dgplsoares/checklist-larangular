<main class="app">
  <h1 class="app__title">{{ title }}</h1>

  <app-todo-form (add)="onAdd($event)" />

  @if (actionError(); as msg) {
    <p class="app__action-error" role="alert">{{ msg }}</p>
  }

  @if (loading()) {
    <p class="app__status">Carregando…</p>
  } @else if (error()) {
    <div class="app__error" role="alert">
      <span>{{ error() }}</span>
      <button type="button" class="btn" (click)="loadTodos()">
        Tentar novamente
      </button>
    </div>
  } @else {
    <app-todo-list
      [todos]="todos()"
      (toggle)="onToggle($event)"
      (remove)="onRemove($event)"
    />
  }
</main>
